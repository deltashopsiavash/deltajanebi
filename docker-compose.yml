services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: deltajanebi-app:latest
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_DJANGO_SETUP: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  bot:
    image: deltajanebi-app:latest
    restart: unless-stopped
    command: ["python", "manage.py", "telegram_bot_v11"]
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - backup_data:/app/backups
      - ./.env:/app/.env.host:ro

  sync:
    image: deltajanebi-app:latest
    restart: unless-stopped
    command: ["python", "manage.py", "sync_loop"]
    env_file: .env
    environment:
      SOURCE_SYNC_INTERVAL: "1800"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  reservations:
    image: deltajanebi-app:latest
    restart: unless-stopped
    command: ["python", "manage.py", "reservation_loop"]
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  static_data:
  media_data:
  backup_data:
  caddy_data:
  caddy_config:
