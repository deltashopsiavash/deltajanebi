name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: Django + installers
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "0"
      DOMAIN: localhost
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DELTAJANEBI_BOT_API_KEY: ci-deltajanebi-api-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python compile check
        run: python -m compileall -q config shop enhancements
      - name: Shell syntax check
        run: bash -n install.sh update.sh install-site.sh update-site.sh install-bot.sh update-bot.sh
      - name: Django system check
        run: python manage.py check --deploy --fail-level ERROR
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations on clean SQLite
        run: python manage.py migrate --noinput
      - name: Delta bot API smoke test
        run: |
          python manage.py shell -c 'import json,os; from django.test import Client; c=Client(); r=c.post("/api/bot/v1/", data=json.dumps({"action":"ping","payload":{}}), content_type="application/json", HTTP_AUTHORIZATION="Bearer "+os.environ["DELTAJANEBI_BOT_API_KEY"]); assert r.status_code==200, r.content; d=r.json(); assert d.get("ok") is True, d; s=d.get("site") or {}; assert s.get("platform")=="deltajanebi", s; assert int(s.get("version") or 0)>=15, s; print("Delta native bot API ping: OK", s)'
      - name: Django tests
        run: python manage.py test --verbosity 1
      - name: README distribution commands
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("README.md").read_text()
          expected = [
              "deltajanebi/main/install-site.sh",
              "deltajanebi/main/install-bot.sh",
              "deltajanebi/main/update-site.sh",
              "deltajanebi/main/update-bot.sh",
          ]
          assert all(x in text for x in expected)
          assert "install.sh | sudo bash" not in text
          assert "sudo deltajanebi-update" not in text
          print("README install/update commands: OK")
          PY
      - name: Docker Compose config
        run: |
          cat > .env <<'EOF'
          DOMAIN=example.com
          DJANGO_SECRET_KEY=compose-ci-secret
          DEBUG=0
          ALLOWED_HOSTS=example.com,localhost,127.0.0.1
          POSTGRES_DB=deltajanebi
          POSTGRES_USER=deltajanebi
          POSTGRES_PASSWORD=compose-ci-password
          DATABASE_URL=postgresql://deltajanebi:compose-ci-password@db:5432/deltajanebi
          DELTAJANEBI_BOT_API_KEY=compose-ci-api-key
          SMTP_HOST=smtp.resend.com
          SMTP_PORT=587
          SMTP_USER=resend
          SMTP_PASSWORD=compose-ci-password
          SMTP_USE_TLS=1
          DEFAULT_FROM_EMAIL=support@example.com
          SOURCE_SYNC_INTERVAL=1800
          STORE_NAME=DeltaJanebi
          EOF
          docker compose config -q

  external-bot:
    name: Native multi-site external bot
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: "123456789:CI_TOKEN_VALUE_NOT_USED_ON_NETWORK"
      TELEGRAM_OWNER_ID: "1"
      BOT_DB_PATH: /tmp/deltajanebi-ci-bot.sqlite3
      BOT_LOCK_PATH: /tmp/deltajanebi-ci-bot.lock
      DELTAJANEBI_RUNTIME_DIR: /tmp/sanashop-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install external bot dependencies
        run: pip install python-telegram-bot==22.3 httpx==0.28.1
      - name: Fetch SanaShop runtime
        run: git clone --depth 1 https://github.com/deltashopsiavash/sanashop.git /tmp/sanashop-runtime
      - name: Compile native router runtime
        run: |
          PYTHONPATH=/tmp/sanashop-runtime python -m py_compile external_bot_delta_v15.py external_bot_delta_v16.py delta_bot_native.py delta_footer_restore.py delta_source_restore.py delta_home_categories_v30.py delta_banner_controls_v31.py delta_help_pages_v33.py delta_sync_progress_v19.py delta_sync_progress_v20.py delta_catalog_ui_v20.py bot_router_regression_v2.py bot_footer_regression.py bot_source_regression.py bot_catalog_regression_v20.py bot_banner_regression_v31.py bot_help_pages_regression_v33.py
      - name: Mixed DB isolation and native capability contract
        run: PYTHONPATH=/tmp/sanashop-runtime python bot_router_regression_v2.py
      - name: Native footer flow regression
        run: PYTHONPATH=/tmp/sanashop-runtime python bot_footer_regression.py
      - name: Native source controls regression
        run: PYTHONPATH=/tmp/sanashop-runtime python bot_source_regression.py
      - name: Delta product pagination regression
        run: PYTHONPATH=/tmp/sanashop-runtime python bot_catalog_regression_v20.py
      - name: Delta banner desktop/mobile regression
        run: PYTHONPATH=/tmp/sanashop-runtime python bot_banner_regression_v31.py
      - name: Delta help-page controls regression
        run: PYTHONPATH=/tmp/sanashop-runtime python bot_help_pages_regression_v33.py
      - name: Entrypoint import smoke test
        run: |
          PYTHONPATH=/tmp/sanashop-runtime python - <<'PY'
          import external_bot_delta_v16 as entry
          import external_bot_delta_v15 as router
          import delta_bot_native as delta
          import delta_footer_restore as footer
          import delta_source_restore as source
          import delta_sync_progress_v20 as progress20
          import delta_catalog_ui_v20 as catalog
          import delta_banner_controls_v31 as banners
          import delta_help_pages_v33 as help_pages
          assert callable(entry.run) and callable(entry.cancel)
          assert callable(router.routed_site_panel) and callable(router.detect_platform)
          assert callable(delta.callback) and callable(delta.message) and callable(delta.media)
          assert callable(footer.install) and callable(footer.normalize_phone)
          assert callable(source.install) and callable(source.callback)
          assert callable(progress20.install) and callable(progress20.progress_text)
          assert callable(catalog.install) and callable(catalog.show_products)
          assert callable(banners.install) and callable(banners.callback)
          assert callable(help_pages.install) and callable(help_pages.callback)
          assert getattr(delta, "_delta_footer_restore_v17_installed", False) is True
          assert getattr(delta, "_delta_source_restore_v18_installed", False) is True
          assert getattr(delta, "_delta_catalog_ui_v20_installed", False) is True
          assert getattr(delta, "_delta_banner_controls_v31_installed", False) is True
          assert getattr(delta, "_delta_help_pages_v33_installed", False) is True
          assert getattr(source, "_delta_sync_progress_v20_installed", False) is True
          print("Delta native multi-site + footer + source + catalog + banner + help-page imports: OK")
          PY
      - name: Installer runtime regression check
        run: |
          grep -q 'external_bot_delta_v16.py' install-bot.sh
          grep -q 'external_bot_delta_v16.py' update-bot.sh
          grep -q 'external_bot_delta_v15.py' install-bot.sh
          grep -q 'external_bot_delta_v15.py' update-bot.sh
          grep -q 'delta_source_restore.py' install-bot.sh
          grep -q 'delta_source_restore.py' update-bot.sh
          grep -q '/var/lib/deltajanebi-bot' install-bot.sh
          grep -q 'deltashopsiavash/deltajanebi.git' install-bot.sh
          grep -q 'deltashopsiavash/deltajanebi.git' update-bot.sh
          grep -q 'deltashopsiavash/sanashop.git' install-bot.sh
          grep -q 'deltashopsiavash/sanashop.git' update-bot.sh
