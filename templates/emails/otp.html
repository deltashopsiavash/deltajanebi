<!doctype html>
<html lang="fa" dir="rtl">
<body style="margin:0;background:#f5f7fa;font-family:Tahoma,Arial,sans-serif;color:#202833">
  <div style="max-width:560px;margin:28px auto;background:#fff;border:1px solid #e8edf3;border-radius:22px;padding:30px 28px;text-align:center">
    {% if logo_url %}<img src="{{ logo_url }}" alt="{{ store.store_name }}" style="max-width:150px;max-height:72px;object-fit:contain">{% else %}<h2>{{ store.store_name }}</h2>{% endif %}
    <h1 style="font-size:21px">تأیید ایمیل</h1>
    <p style="color:#667085;line-height:2">برای تکمیل ثبت‌نام، کد زیر را در سایت وارد کنید.</p>
    <div dir="ltr" style="display:inline-block;font-size:36px;font-weight:900;letter-spacing:9px;background:#f1f7ff;border-radius:16px;padding:18px 20px;color:#1268b3">{{ code }}</div>
    <p style="font-size:12px;color:#8b95a4;line-height:2">این کد ۱۰ دقیقه معتبر است. اگر شما درخواست ثبت‌نام نداده‌اید، این ایمیل را نادیده بگیرید.</p>
  </div>
</body>
</html>
