<!doctype html>
<html lang="fa" dir="rtl">
<body style="margin:0;background:#f5f7fa;font-family:Tahoma,Arial,sans-serif;color:#202833">
  <div style="max-width:600px;margin:28px auto;background:#fff;border:1px solid #e8edf3;border-radius:22px;padding:30px 28px">
    <div style="text-align:center;margin-bottom:24px">{% if logo_url %}<img src="{{ logo_url }}" alt="{{ store.store_name }}" style="max-width:160px;max-height:76px;object-fit:contain">{% else %}<h2>{{ store.store_name }}</h2>{% endif %}</div>
    <div style="font-size:15px;line-height:2.15">{{ body_html|safe }}</div>
  </div>
</body>
</html>
