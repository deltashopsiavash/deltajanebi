<!doctype html>
<html lang="fa" dir="rtl">
<body style="margin:0;background:#f5f7fa;font-family:Tahoma,Arial,sans-serif;color:#202833">
  <div style="max-width:560px;margin:28px auto;background:#fff;border:1px solid #e8edf3;border-radius:22px;padding:30px 28px;text-align:center">
    {% if logo_url %}<img src="{{ logo_url }}" alt="{{ store.store_name }}" style="max-width:150px;max-height:72px;object-fit:contain">{% else %}<h2>{{ store.store_name }}</h2>{% endif %}
    <h1 style="font-size:21px">بازیابی رمز عبور</h1>
    <p style="color:#667085;line-height:2">برای انتخاب رمز عبور جدید روی دکمه زیر بزنید.</p>
    <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;background:#1268b3;color:#fff;text-decoration:none;padding:13px 24px;border-radius:12px;font-weight:800">تغییر رمز عبور</a>
    <p style="font-size:12px;color:#8b95a4;line-height:2;margin-top:22px">اگر شما درخواست بازیابی رمز نداده‌اید، این ایمیل را نادیده بگیرید.</p>
  </div>
</body>
</html>
