<div class="grid">{% for p in products %}<article class="card"><a href="{{ p.get_absolute_url }}" class="pic">{% if p.primary_image %}<img src="{{ p.primary_image }}" loading="lazy" alt="{{ p.name }}">{% else %}<span>بدون تصویر</span>{% endif %}</a><div class="card-body"><div class="stock {% if p.stock %}yes{% endif %}">{% if p.stock %}موجود{% else %}ناموجود{% endif %}</div><a class="title" href="{{ p.get_absolute_url }}">{{ p.name }}</a><div class="price"><b>{{ p.price|floatformat:0 }}</b> تومان</div><form method="post" action="{% url 'cart_add' p.id %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.path }}"><button class="btn wide" {% if not p.stock %}disabled{% endif %}>افزودن به سبد</button></form></div></article>{% empty %}<div class="empty">محصولی پیدا نشد.</div>{% endfor %}</div>
