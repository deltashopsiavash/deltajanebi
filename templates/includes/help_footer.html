<style>
.footer-help-area{margin-top:24px}.footer-help-menu{max-width:760px;margin:0 auto;border:1px solid #e7edf3;border-radius:20px;background:#f9fbfd;overflow:hidden;box-shadow:0 8px 24px rgba(20,38,63,.05)}.footer-help-menu summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px 17px;user-select:none}.footer-help-menu summary::-webkit-details-marker{display:none}.footer-help-summary-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#147bd1;color:#fff;font-size:18px;font-weight:950}.footer-help-menu summary>span:nth-child(2){display:grid;gap:2px;flex:1}.footer-help-menu summary b{font-size:14px;color:#26313d}.footer-help-menu summary small{font-size:10px;color:#8a95a2}.footer-help-menu summary>i{font-style:normal;color:#84909c;transition:.2s}.footer-help-menu[open] summary>i{transform:rotate(180deg)}.footer-help-links{display:grid;gap:8px;padding:0 12px 12px}.footer-help-links a{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:10px 11px;border-radius:14px;background:#fff;border:1px solid #edf1f5;text-decoration:none;color:#2a3440;transition:.18s}.footer-help-links a:hover{transform:translateY(-1px);border-color:#cfe3f7;box-shadow:0 7px 18px rgba(20,75,125,.07)}.footer-help-link-icon{width:36px;height:36px;border-radius:11px;background:#eff7ff;color:#147bd1;display:grid;place-items:center;font-weight:900}.footer-help-links a>span:nth-child(2){display:grid;gap:2px}.footer-help-links a b{font-size:12px}.footer-help-links a small{font-size:9px;color:#96a0aa}.footer-help-links a>i{font-style:normal;color:#9aa5b0;font-size:18px}html[data-theme="dark"] .footer-help-menu{background:#181d24;border-color:#303741;box-shadow:none}html[data-theme="dark"] .footer-help-menu summary b,html[data-theme="dark"] .footer-help-links a{color:#edf2f7}html[data-theme="dark"] .footer-help-menu summary small,html[data-theme="dark"] .footer-help-links a small{color:#9faab6}html[data-theme="dark"] .footer-help-links a{background:#1e242c;border-color:#323a45}html[data-theme="dark"] .footer-help-link-icon{background:#203244;color:#65b5ff}@media(max-width:760px){.footer-help-area{margin-top:20px}.footer-help-menu{border-radius:17px}.footer-help-menu summary{padding:13px 14px}.footer-help-summary-icon{width:35px;height:35px}.footer-help-links{padding:0 9px 9px}.footer-help-links a{padding:9px}}
</style>
<section class="footer-help-area" aria-label="راهنمای فروشگاه">
  <details class="footer-help-menu">
    <summary><span class="footer-help-summary-icon">?</span><span><b>راهنما</b><small>قوانین، بازگشت کالا و راهنمای خرید</small></span><i>⌄</i></summary>
    <div class="footer-help-links">
      {% for page in help_pages %}
        {% if page.slug == 'rules' %}<a href="{% url 'terms' %}">{% else %}<a href="{% url 'help_page' page.slug %}">{% endif %}
          <span class="footer-help-link-icon">{% if page.slug == 'rules' %}⚖{% elif page.slug == 'returns' %}↩{% elif page.slug == 'buying-guide' %}🛍{% else %}•{% endif %}</span>
          <span><b>{{ page.title }}</b><small>مشاهده توضیحات کامل</small></span><i>‹</i>
        </a>
      {% endfor %}
    </div>
  </details>
</section>
