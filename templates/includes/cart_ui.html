<style>
.cart-added-overlay,.mini-cart-backdrop{position:fixed;inset:0;background:rgba(9,18,32,.52);backdrop-filter:blur(3px);z-index:1800;opacity:0;visibility:hidden;transition:.2s}.cart-added-overlay.open,.mini-cart-backdrop.open{opacity:1;visibility:visible}.cart-added-card{position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);width:min(92vw,480px);background:#fff;border-radius:24px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.24);transition:.22s}.cart-added-overlay.open .cart-added-card{transform:translate(-50%,-50%)}.cart-added-close{position:absolute;left:14px;top:12px;border:0;background:#f2f4f7;width:36px;height:36px;border-radius:50%;font-size:23px;cursor:pointer}.cart-added-product{display:flex;align-items:center;gap:16px;padding-top:10px}.cart-added-product img{width:92px;height:92px;object-fit:contain;border:1px solid #edf0f3;border-radius:16px}.cart-added-product .no-img{width:92px;height:92px;background:#f5f6f8;border-radius:16px;display:grid;place-items:center;color:#9aa3af}.cart-added-product strong{display:block;font-size:15px;line-height:1.8}.cart-added-product small{color:#8b95a2}.cart-added-success{color:#07884a;font-weight:900;margin-bottom:8px}.cart-added-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.cart-added-actions button,.cart-added-actions a{height:48px;border-radius:13px;display:grid;place-items:center;font-weight:900;text-decoration:none;cursor:pointer}.cart-added-go{background:#0878e8;color:#fff;border:0}.cart-added-continue{background:#f4f6f8;color:#29323d;border:1px solid #e3e7ec}.mini-cart-drawer{position:absolute;left:0;top:0;height:100%;width:min(92vw,430px);background:#fff;transform:translateX(-105%);transition:.28s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;box-shadow:20px 0 60px rgba(0,0,0,.2)}.mini-cart-backdrop.open .mini-cart-drawer{transform:none}.mini-cart-head{padding:20px;border-bottom:1px solid #edf0f3;display:flex;align-items:center;justify-content:space-between}.mini-cart-head strong{font-size:17px}.mini-cart-head button{width:38px;height:38px;border:0;border-radius:50%;background:#f2f4f7;font-size:24px;cursor:pointer}.mini-cart-body{padding:12px 16px;overflow:auto;flex:1}.mini-cart-empty{text-align:center;color:#87919e;padding:60px 15px}.mini-cart-line{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f3}.mini-cart-line img{width:72px;height:72px;border-radius:13px;object-fit:contain;border:1px solid #edf0f3}.mini-cart-line h4{margin:0;font-size:12px;line-height:1.75}.mini-cart-code{font-size:10px;color:#929ba7;direction:ltr;text-align:right}.mini-cart-price{font-weight:900;font-size:12px;margin-top:5px}.mini-cart-controls{display:flex;align-items:center;gap:7px;margin-top:9px}.mini-cart-controls button{width:30px;height:30px;border:1px solid #dce2e8;background:#fff;border-radius:9px;cursor:pointer;font-size:16px}.mini-cart-controls .remove{width:auto;padding:0 9px;color:#c7283e;background:#fff4f5;border-color:#ffd8dd;font-size:10px}.mini-cart-foot{border-top:1px solid #e8ecf0;padding:16px 18px;background:#fff}.mini-cart-total{display:flex;justify-content:space-between;font-size:14px;margin-bottom:14px}.mini-cart-total b{font-size:17px}.mini-cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini-cart-actions a{height:46px;border-radius:12px;display:grid;place-items:center;text-decoration:none;font-weight:900;font-size:12px}.mini-checkout{background:#0878e8;color:#fff}.mini-view{border:1px solid #dfe4ea;color:#28313d;background:#fff}.mini-free-note{background:#edf9f2;color:#16834b;border-radius:11px;padding:9px 11px;font-size:10px;margin-bottom:10px;text-align:center}.mini-free-note.pending{background:#fff7e8;color:#996515}.cart-loading{padding:40px;text-align:center;color:#7d8793}.mnav-count,.mobile-tool-badge{transition:.2s}@media(max-width:600px){.cart-added-card{padding:20px;border-radius:20px}.cart-added-actions{grid-template-columns:1fr}.mini-cart-drawer{width:94vw}.mini-cart-actions{grid-template-columns:1fr 1fr}}
</style>

<div class="cart-added-overlay" id="cart-added-overlay" aria-hidden="true"><div class="cart-added-card"><button type="button" class="cart-added-close" id="cart-added-close">×</button><div class="cart-added-success">✓ محصول به سبد خرید اضافه شد</div><div class="cart-added-product" id="cart-added-product"></div><div class="cart-added-actions"><button class="cart-added-go" id="cart-added-go" type="button">رفتن به سبد خرید</button><button class="cart-added-continue" id="cart-added-continue" type="button">ادامه خرید</button></div></div></div>
<div class="mini-cart-backdrop" id="mini-cart-backdrop" aria-hidden="true"><aside class="mini-cart-drawer"><div class="mini-cart-head"><strong>سبد خرید من</strong><button id="mini-cart-close" type="button">×</button></div><div class="mini-cart-body" id="mini-cart-body"><div class="cart-loading">در حال دریافت سبد خرید...</div></div><div class="mini-cart-foot" id="mini-cart-foot"></div></aside></div>

<script>
(function(){
 const addOverlay=document.getElementById('cart-added-overlay'),addProduct=document.getElementById('cart-added-product'),mini=document.getElementById('mini-cart-backdrop'),miniBody=document.getElementById('mini-cart-body'),miniFoot=document.getElementById('mini-cart-foot');
 const money=n=>new Intl.NumberFormat('en-US').format(Number(n||0));
 const csrf=()=>{const m=document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);return m?decodeURIComponent(m[1]):''};
 function updateCount(n){document.querySelectorAll('.mnav-count,.mobile-tool-badge').forEach(x=>x.textContent=String(n||0));document.querySelectorAll('.store-cart b').forEach(x=>x.textContent=(n||0)?`${n} کالا`:'خالی است')}
 function closeAdded(){addOverlay.classList.remove('open');addOverlay.setAttribute('aria-hidden','true')}
 function showAdded(item,count){updateCount(count);addProduct.innerHTML=`${item.image?`<img src="${item.image}" alt="">`:`<div class="no-img">بدون عکس</div>`}<div><strong>${item.name}</strong><small>${item.code||''}</small></div>`;addOverlay.classList.add('open');addOverlay.setAttribute('aria-hidden','false')}
 function closeMini(){mini.classList.remove('open');mini.setAttribute('aria-hidden','true')}
 function freeNote(d){if(!d.free_shipping_threshold)return '';if(d.free_shipping)return `<div class="mini-free-note">✓ ارسال این سفارش رایگان است</div>`;return `<div class="mini-free-note pending">برای ارسال رایگان ${money(d.remaining_to_free_shipping)} تومان دیگر خرید کنید</div>`}
 function render(d){updateCount(d.count);if(!d.lines.length){miniBody.innerHTML='<div class="mini-cart-empty">سبد خرید شما خالی است.</div>';miniFoot.innerHTML='';return}miniBody.innerHTML=d.lines.map(x=>`<div class="mini-cart-line" data-id="${x.id}"><a href="${x.url}">${x.image?`<img src="${x.image}" alt="">`:''}</a><div><h4>${x.name}</h4><div class="mini-cart-code">${x.code||''}</div><div class="mini-cart-price">${money(x.unit_price)} تومان</div><div class="mini-cart-controls"><button data-cart-minus="${x.id}" data-qty="${x.qty}">−</button><b>${x.qty}</b><button data-cart-plus="${x.id}" data-qty="${x.qty}" data-stock="${x.stock}">+</button><button class="remove" data-cart-remove="${x.id}">حذف</button></div></div></div>`).join('');miniFoot.innerHTML=`${freeNote(d)}<div class="mini-cart-total"><span>مبلغ نهایی</span><b>${money(d.total)} تومان</b></div><div class="mini-cart-actions"><a class="mini-checkout" href="/checkout/">تسویه حساب</a><a class="mini-view" data-cart-page="1" href="/cart/">مشاهده سبد خرید</a></div>`}
 async function loadCart(){miniBody.innerHTML='<div class="cart-loading">در حال دریافت سبد خرید...</div>';miniFoot.innerHTML='';const r=await fetch('/cart/data/',{headers:{'X-Requested-With':'XMLHttpRequest'}});const d=await r.json();render(d)}
 async function openMini(){closeAdded();mini.classList.add('open');mini.setAttribute('aria-hidden','false');await loadCart()}
 async function setQty(id,qty){const fd=new FormData();fd.append('qty',Math.max(0,qty));fd.append('csrfmiddlewaretoken',csrf());const r=await fetch(`/cart/set/${id}/`,{method:'POST',body:fd,headers:{'X-Requested-With':'XMLHttpRequest'}});const d=await r.json();if(d.ok)render(d)}
 document.addEventListener('submit',async e=>{const form=e.target;if(!form.action||!form.action.includes('/cart/add/'))return;e.preventDefault();try{const r=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{'X-Requested-With':'XMLHttpRequest','Accept':'application/json'}});const d=await r.json();if(!r.ok||!d.ok){alert(d.error||'افزودن محصول انجام نشد');return}showAdded(d.added,d.count)}catch(_){form.submit()}});
 document.addEventListener('click',e=>{const cartLink=e.target.closest('a[href$="/cart/"]');if(cartLink&&!cartLink.dataset.cartPage){e.preventDefault();openMini();return}const minus=e.target.closest('[data-cart-minus]');if(minus){setQty(minus.dataset.cartMinus,Number(minus.dataset.qty)-1);return}const plus=e.target.closest('[data-cart-plus]');if(plus){setQty(plus.dataset.cartPlus,Math.min(Number(plus.dataset.stock),Number(plus.dataset.qty)+1));return}const remove=e.target.closest('[data-cart-remove]');if(remove){setQty(remove.dataset.cartRemove,0)}});
 document.getElementById('cart-added-close').addEventListener('click',closeAdded);document.getElementById('cart-added-continue').addEventListener('click',closeAdded);document.getElementById('cart-added-go').addEventListener('click',openMini);document.getElementById('mini-cart-close').addEventListener('click',closeMini);addOverlay.addEventListener('click',e=>{if(e.target===addOverlay)closeAdded()});mini.addEventListener('click',e=>{if(e.target===mini)closeMini()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAdded();closeMini()}});
})();
</script>
